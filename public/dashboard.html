<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0080FF">
<title>数据统计 · 百花同行</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>

  <!-- ===== 顶栏（与主站同构）===== -->
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="/logo.png" alt="百花同行">
      <span class="brand-text">
        <img class="brand-wordmark" src="/wordmark.png" alt="百花同行">
        <span class="brand-slogan">不再一个人出发</span>
      </span>
    </div>
    <div class="topbar-right">
      <span class="dash-updated" id="updatedAt"></span>
      <button class="btn-ghost" id="refreshBtn" onclick="load()">刷新</button>
    </div>
  </header>

  <main class="dash-main">
    <div class="chips chips-track dash-days" id="daysChips">
      <button class="chip" data-days="7" onclick="setDays(7)">近 7 天</button>
      <button class="chip on" data-days="30" onclick="setDays(30)">近 30 天</button>
      <button class="chip" data-days="90" onclick="setDays(90)">近 90 天</button>
    </div>

    <!-- ===== 转化漏斗 ===== -->
    <section class="panel">
      <h3 class="panel-title">转化漏斗 <span class="panel-sub">去重人数</span></h3>
      <div id="funnel" class="funnel"><div class="state-sm">加载中…</div></div>
    </section>

    <!-- ===== 每日趋势 ===== -->
    <section class="panel">
      <h3 class="panel-title">每日趋势 <span class="panel-sub">次数 / 天</span></h3>
      <div class="chips chips-track dash-series" id="seriesChips"></div>
      <div id="chart" class="chart-box"></div>
    </section>

    <div class="dash-cols">
      <!-- ===== 撮合健康度 ===== -->
      <section class="panel">
        <h3 class="panel-title">撮合健康度 <span class="panel-sub" id="matchSamples"></span></h3>
        <div id="match" class="stats-grid"><div class="state-sm">加载中…</div></div>
      </section>

      <!-- ===== 人均费用 ===== -->
      <section class="panel">
        <h3 class="panel-title">人均费用参考</h3>
        <div id="fee" class="stats-grid"><div class="state-sm">加载中…</div></div>
      </section>
    </div>

    <p class="dash-note">数据说明：验证码 / 登录 / 改名事件自 2026-09-13 起记录；行程浏览仅统计登录用户；埋点保留 90 天；健康度中的「被加入」含加入后退出的行程。</p>
  </main>

  <footer class="site-foot">
    <span>© 2026 </span><a href="https://prom1se.cn" target="_blank" rel="noopener">Prom1seCN</a>
    <span class="dot">·</span>
    <a href="https://beian.miit.gov.cn/#/Integrated/index" target="_blank" rel="noopener">浙ICP备2026023301号</a>
  </footer>

  <!-- ===== 密钥（ADMIN_KEY 鉴权，本机保存）===== -->
  <div class="mask" id="keyMask" style="display:none">
    <div class="sheet">
      <h3 class="sheet-title">管理员访问</h3>
      <p class="sheet-hint">输入管理密钥查看数据统计</p>
      <div class="field-row">
        <input class="input-grow" id="keyInput" type="password" placeholder="管理密钥" autocomplete="off">
      </div>
      <p class="err" id="keyError" style="display:none"></p>
      <button class="btn-primary block" onclick="saveKey()">查看数据</button>
    </div>
  </div>

<script src="/dashboard.js"></script>
</body>
</html>
